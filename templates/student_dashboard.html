<html>
<head>
<title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Student Dashboard</h2>

<h3>Available Placement Drives</h3>

<table class="table table-bordered table-striped">

<tr>
<th>Job Title</th>
<th>Description</th>
<th>Action</th>
</tr>

{% for drive in drives %}

<tr>

<td>{{ drive.job_title }}</td>
<td>{{ drive.description }}</td>

<td>
<form method="POST" action="/apply/{{student.id}}/{{drive.id}}">
<button class="btn btn-success btn-sm">Apply</button>
</form>
</td>

</tr>

{% endfor %}

</table>

<h3 class="mt-5">My Applications</h3>

{% for app in applications %}

<p>
Drive ID: {{ app.drive_id }} |
Status: {{ app.status }}
</p>

{% endfor %}

</div>

</body>
</html>
