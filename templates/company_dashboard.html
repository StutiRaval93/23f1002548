<html>
<head>
<title>Company Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Company Dashboard</h2>

<p><strong>Welcome {{ company.company_name }}</strong></p>

<a class="btn btn-primary mb-3" href="/create_drive">Create Placement Drive</a>

<h3>Your Placement Drives</h3>

<table class="table table-bordered table-striped">

<tr>
<th>Job Title</th>
<th>Description</th>
<th>Status</th>
<th>Applications</th>
</tr>

{% for drive in drives %}

<tr>

<td>{{ drive.job_title }}</td>
<td>{{ drive.description }}</td>
<td>{{ drive.status }}</td>

<td>
<a class="btn btn-secondary btn-sm" href="/view_applications/{{drive.id}}">
View Applications
</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
